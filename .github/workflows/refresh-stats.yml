name: Refresh stats cards

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download cards
        run: |
          mkdir -p assets
          curl -fsSL --retry 4 --retry-all-errors --max-time 30 \
            -o assets/github-stats.svg \
            "https://github-readme-stats.shion.dev/api?username=roshan2498&show_icons=true&theme=tokyonight&include_all_commits=true&count_private=true&hide_border=true"
          curl -fsSL --retry 4 --retry-all-errors --max-time 30 \
            -o assets/github-langs.svg \
            "https://github-readme-stats.shion.dev/api/top-langs/?username=roshan2498&layout=compact&langs_count=8&theme=tokyonight&hide_border=true"
          curl -fsSL --retry 4 --retry-all-errors --max-time 90 \
            -o assets/github-streak.svg \
            "https://streak-stats.demolab.com?user=roshan2498&theme=tokyonight&hide_border=true"
          grep -q '<svg' assets/github-stats.svg assets/github-langs.svg assets/github-streak.svg

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-stats.svg assets/github-langs.svg assets/github-streak.svg
          if git diff --staged --quiet; then
            echo "No card changes"
          else
            git commit -m "Refresh GitHub stats cards"
            git push
          fi
